services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://irelandsepticsolutions.com}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://irelandsepticsolutions.com}
      NEXT_PUBLIC_PHONE_DISPLAY: ${NEXT_PUBLIC_PHONE_DISPLAY:-1800-XXX-XXXX}
      NEXT_PUBLIC_PHONE_E164: ${NEXT_PUBLIC_PHONE_E164:-+3531800XXXXXX}
    restart: unless-stopped
